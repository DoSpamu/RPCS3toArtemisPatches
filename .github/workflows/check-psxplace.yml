name: Check PSXPlace Thread

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch:        # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  check:
    runs-on: [self-hosted, psxplace]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Install Camoufox browser (no-op if baked version is current)
        run: npx camoufox fetch

      - name: Scrape thread and parse new patches
        id: scrape
        # DEBUG: run the GPU/Wayland diag under cage (wlroots headless backend +
        # GPU renderer) so Firefox renders WebGL on the real Intel iGPU. Revert
        # to `node scripts/check_psxplace.js` before merge.
        run: |
          export XDG_RUNTIME_DIR=/tmp/xdgrt
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          export WLR_BACKENDS=headless WLR_RENDERER=gles2 WLR_RENDER_DRM_DEVICE=/dev/dri/renderD128 WLR_RENDERER_ALLOW_SOFTWARE=1
          export MOZ_ENABLE_WAYLAND=1 LIBGL_ALWAYS_SOFTWARE=0 MESA_LOADER_DRIVER_OVERRIDE=iris
          export MOZ_DISABLE_CONTENT_SANDBOX=1 MOZ_DISABLE_GPU_SANDBOX=1
          cage -- node scripts/cf_matrix_diag.js
        continue-on-error: true
        # Exit codes: 2 = Cloudflare block, 3 = empty scrape (layout change), 1 = crash.
        # continue-on-error lets the commit step save partial results;
        # the final step re-raises the failure so the run goes red and alerts us.

      - name: Commit new patches to master
        if: always()
        run: |
          if [ ! -f pr_body.txt ]; then
            echo "No new patches found (or scraper was blocked). Nothing to commit."
            exit 0
          fi

          DATE=$(date +%Y-%m-%d)

          # Regenerate README Community Confirmed table and badge counts
          node scripts/update_readme.js

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add known_posts.json new_patches_raw/ "PSXPlace Confirmed/" USERLIST/ README.md banner.svg 2>/dev/null || true
          git diff --cached --quiet && echo "Nothing staged." && exit 0
          git commit -m "[Auto] PSXPlace new patches $DATE"
          git push origin master

      - name: Fail run if scraper failed
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "Scraper failed — see the scrape step logs (CF_BLOCKED / SCRAPE_EMPTY / crash)."
          exit 1
