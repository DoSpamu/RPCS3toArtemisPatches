name: Check PSXPlace Thread

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch:        # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Camoufox browser
        run: npx camoufox fetch

      - name: Scrape thread and parse new patches
        run: node scripts/check_psxplace.js
        continue-on-error: true
        # Exit 1 means Cloudflare blocked — workflow continues to PR step via if: always()

      - name: Commit new patches to master
        if: always()
        run: |
          if [ ! -f pr_body.txt ]; then
            echo "No new patches found (or scraper was blocked). Nothing to commit."
            exit 0
          fi

          DATE=$(date +%Y-%m-%d)

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add known_posts.json new_patches_raw/ "PSXPlace Confirmed/" 2>/dev/null || true
          git diff --cached --quiet && echo "Nothing staged." && exit 0
          git commit -m "[Auto] PSXPlace new patches $DATE"
          git push origin master
