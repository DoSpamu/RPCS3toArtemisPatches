# PSXPlace monitor — self-hosted runner stack (Portainer, Repository method).
#
# Deploy in Portainer: Stacks → Add stack → Build method: Repository
#   Repository URL:  https://github.com/DoSpamu/RPCS3toArtemisPatches
#   Reference:       refs/heads/fix/turnstile-shadow-dom   (or master once merged)
#   Compose path:    docker-compose.yml                    (this file, at repo root)
#   Environment variables:  ACCESS_TOKEN = <fine-grained PAT>,  RENDER_GID = 104
#
# The compose lives at the repo ROOT so the build context is "." (the repo) —
# Portainer 500s on a context that escapes the compose dir (e.g. ../..). A
# .dockerignore keeps the context tiny (only package*.json, which the Dockerfile
# needs). ACCESS_TOKEN is a PAT scoped to this repo with Administration RW —
# supply it as a Portainer stack env var, NEVER commit it.
services:
  ofelia:
    image: mcuadros/ofelia:latest
    container_name: psxplace-ofelia
    restart: unless-stopped
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      # Ofelia cron has 6 fields (seconds first); container TZ is UTC.
      # 05:55 UTC = 5 min before the GitHub cron (06:00 UTC).
      ofelia.job-run.wake-runner.schedule: "0 55 5 * * *"
      ofelia.job-run.wake-runner.container: "psxplace-runner"
    mem_limit: 64m

  runner:
    build:
      context: .
      dockerfile: deploy/nuc-runner/Dockerfile
    image: psxplace-runner:latest
    container_name: psxplace-runner
    # DEBUG MODE (2026-07-19): temporarily PERSISTENT so tests don't wait for the
    # daily wake window. REVERT to the ephemeral wake-window design after the
    # Cloudflare WebGL fix: restart:"no" + EPHEMERAL:"1".
    restart: unless-stopped
    environment:
      RUNNER_NAME: psxplace-runner   # visible in public run logs — keep neutral
      RUNNER_SCOPE: repo
      REPO_URL: https://github.com/DoSpamu/RPCS3toArtemisPatches
      ACCESS_TOKEN: ${ACCESS_TOKEN}
      LABELS: psxplace               # must match runs-on in check-psxplace.yml
      EPHEMERAL: "0"                 # DEBUG: persistent; restore "1" after fix
      RUN_AS_ROOT: "false"           # Firefox refuses root; image bakes GID 104
    # GPU passthrough: the NUC's iGPU so Firefox gets a REAL hardware WebGL
    # renderer instead of software "llvmpipe" (which Cloudflare flags as a bot
    # and withholds the Turnstile widget). renderD128's group is GID 104.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID}"
    mem_limit: 2g
    cpus: 1.5
    networks:
      - runner-net

networks:
  runner-net:
    driver: bridge
